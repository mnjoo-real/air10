# Pilot physical simulation config (README "pilot physical simulation config").
# Same as pilot_H050_RPM0500.yaml at RPM=1500. See that file's header for
# the calibration caveat -- forcing_tau_s here is UNCALIBRATED.
geometry:
  vessel_radius_m: 0.045
  vessel_height_m: 0.125
  water_height_m: 0.050
  air_height_m: 0.030
  stirbar_length_m: 0.030
  stirbar_diameter_m: 0.007
  stirbar_center_z_m: 0.0035

fluid:
  water_density: 998.0
  water_viscosity: 0.00100
  air_density: 1.20
  air_viscosity: 0.000018
  surface_tension: 0.072
  gravity: 9.81

stirrer:
  rpm: 1500
  actual_rpm: null
  ramp_time_s: 0.3
  forcing_tau_s: 0.005   # UNCALIBRATED placeholder
  forcing_smoothing_m: 0.001
  calibrated: false

grid:
  dr_m: 0.0005
  dz_m: 0.0005

time:
  t_end_s: 8.0
  cfl: 0.30
  dt_max_s: 0.0005

levelset:
  interface_width_cells: 1.5
  reinitialize_every: 5
  reinitialize_iterations: 3

air_core:
  contact_tolerance_cells: 2
  persistence_rotations: 5

steady_state:
  enabled: true
  window_s: 0.5
  min_time_s: 1.0
  relative_range_tolerance: 0.01
  slope_tolerance_mm_per_s: 0.1
  required_windows: 3

output:
  save_every_s: 0.02
