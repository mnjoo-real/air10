# Level 1A (single_phase_ls) Gate V3: rigid-body rotating liquid, sigma = 0,
# with MATCHED (co-rotating container) tangential BC. The rotation rate is
# NOT a stirrer RPM: it is given to scripts/validate_single_phase_milestone1.py
# (--omega) and used only for the manufactured initial state and the
# validation-only WallBC.rotating(...). stirrer.rpm stays 0.
physics:
  free_surface_model: single_phase_ls
  extension_layers: 3

geometry:
  vessel_radius_m: 0.024
  vessel_height_m: 0.040
  water_height_m: 0.018
  air_height_m: 0.012
  stirbar_length_m: 0.012
  stirbar_diameter_m: 0.004
  stirbar_center_z_m: 0.002

fluid:
  water_density: 998.0
  water_viscosity: 0.00100
  air_density: 1.20          # unused by single_phase_ls
  air_viscosity: 0.000018    # unused by single_phase_ls
  surface_tension: 0.0
  gravity: 9.81

stirrer:
  rpm: 0
  ramp_time_s: 0.05
  forcing_tau_s: 0.01
  forcing_smoothing_m: 0.001

grid:
  dr_m: 0.0015
  dz_m: 0.0015

time:
  t_end_s: 1.0
  cfl: 0.30
  dt_max_s: 0.0002

levelset:
  interface_width_cells: 1.5
  reinitialize_every: 0
  reinitialize_iterations: 2
  advection_scheme: muscl2
  time_integrator: ssprk2
  limiter: mc
  # used only when reinitialize_every > 0 (Gate V5b/V5c, docs/level1a_single_phase.md sec. 7)
  reinitialization_method: russo_smereka_subcell
  reinitialization_order: 2
  reinitialization_cfl: 0.45
  reinitialization_trigger: periodic

air_core:
  contact_tolerance_cells: 2
  persistence_rotations: 5

output:
  save_every_s: 0.05
