[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "air-vortex"
version = "0.1.0"
description = "Axisymmetric two-phase CFD simulation of a magnetic-stirrer air vortex (KYPT/IYPT 2027 Problem 10)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "numba>=0.58",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-image>=0.21",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "h5py>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
